<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NAACUS Content Manager</title>
    <script>
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init = {}) => {
        const requestUrl = typeof input === 'string'
          ? input
          : input && typeof input.url === 'string'
            ? input.url
            : '';

        if (!/\/admin\/config\.yml(?:\?|$)/.test(requestUrl)) {
          return nativeFetch(input, init);
        }

        const separator = requestUrl.includes('?') ? '&' : '?';
        const bustedUrl = `${requestUrl}${separator}v=${Date.now()}`;

        return nativeFetch(bustedUrl, {
          ...init,
          cache: 'no-store',
          headers: {
            ...(init.headers || {}),
            'Cache-Control': 'no-cache',
            Pragma: 'no-cache'
          }
        });
      };
    </script>
  </head>
  <body>
    <script
      src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"
      integrity="sha384-zQmFlOQ/XomwFYm/TxeQ5kACvVVgZ/QRhxcvWOYmR2S1ruSgHYPc/XJYllIrLyIB"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
