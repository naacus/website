backend:
  name: git-gateway
  repo: naacus/website
  branch: develop
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c8126a0f-9593-4e22-9529-c0fa95d00902/pkce
  auth_token_endpoint: /sites/c8126a0f-9593-4e22-9529-c0fa95d00902/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://test.naacus.org

publish_mode: editorial_workflow

media_folder: "naacus-website/public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "content_en"
    label: "Common Text (English)"
    editor:
      preview: false
    files:
      - name: "hero_text_en"
        label: "Home Page - Hero Text (EN)"
        file: "naacus-website/public/content/hero.en.json"
        fields:
          - { label: "Title", name: "title", widget: "string", pattern: ['^.{1,80}$', 'Max 80 characters'] }
          - { label: "Subtitle", name: "subtitle", widget: "text", pattern: ['^[\\s\\S]{1,180}$', 'Max 180 characters'] }
          - { label: "Membership Teaser", name: "membershipTeaser", widget: "string", pattern: ['^.{1,120}$', 'Max 120 characters'] }
          - { label: "Benefit 1", name: "benefit1", widget: "string", pattern: ['^.{1,80}$', 'Max 80 characters'] }
          - { label: "Benefit 2", name: "benefit2", widget: "string", pattern: ['^.{1,80}$', 'Max 80 characters'] }
          - { label: "Benefit 3", name: "benefit3", widget: "string", pattern: ['^.{1,80}$', 'Max 80 characters'] }
          - { label: "Join Community", name: "joinCommunity", widget: "string", pattern: ['^.{1,60}$', 'Max 60 characters'] }
          - { label: "Learn Mission", name: "learnMission", widget: "string", pattern: ['^.{1,60}$', 'Max 60 characters'] }
          - { label: "View Calendar", name: "viewCalendar", widget: "string", pattern: ['^.{1,40}$', 'Max 40 characters'] }
          - { label: "Get Involved", name: "getInvolved", widget: "string", pattern: ['^.{1,40}$', 'Max 40 characters'] }
      - name: "faq_text_en"
        label: "FAQ Page Text (EN)"
        file: "naacus-website/public/content/faq.en.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string", pattern: ['^.{1,80}$', 'Max 80 characters'] }
          - { label: "Page Subtitle", name: "subtitle", widget: "text", pattern: ['^[\\s\\S]{1,180}$', 'Max 180 characters'] }
          - { label: "Search Placeholder", name: "searchPlaceholder", widget: "string", pattern: ['^.{1,80}$', 'Max 80 characters'] }
          - { label: "Search Input Label", name: "searchInputLabel", widget: "string", pattern: ['^.{1,100}$', 'Max 100 characters'] }
          - { label: "Clear Search Label", name: "clearSearch", widget: "string", pattern: ['^.{1,60}$', 'Max 60 characters'] }
          - { label: "Filter By Category", name: "filterByCategory", widget: "string", pattern: ['^.{1,60}$', 'Max 60 characters'] }

