backend:
  name: git-gateway
  repo: naacus/website
  branch: develop
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c8126a0f-9593-4e22-9529-c0fa95d00902/pkce
  auth_token_endpoint: /sites/c8126a0f-9593-4e22-9529-c0fa95d00902/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://test.naacus.org

publish_mode: editorial_workflow

media_folder: "naacus-website/public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "content_en"
    label: "Website Content (English)"
    editor:
      preview: false
    files:
      - name: "hero_text_en"
        label: "Hero Text (EN)"
        file: "naacus-website/public/content/hero.en.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - { label: "Membership Teaser", name: "membershipTeaser", widget: "string" }
          - { label: "Benefit 1", name: "benefit1", widget: "string" }
          - { label: "Benefit 2", name: "benefit2", widget: "string" }
          - { label: "Benefit 3", name: "benefit3", widget: "string" }
          - { label: "Join Community", name: "joinCommunity", widget: "string" }
          - { label: "Learn Mission", name: "learnMission", widget: "string" }
          - { label: "View Calendar", name: "viewCalendar", widget: "string" }
          - { label: "Get Involved", name: "getInvolved", widget: "string" }
      - name: "faq_text_en"
        label: "FAQ Text (EN)"
        file: "naacus-website/public/content/faq.en.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "text" }
          - { label: "Search Placeholder", name: "searchPlaceholder", widget: "string" }
          - { label: "Search Input Label", name: "searchInputLabel", widget: "string" }
          - { label: "Clear Search Label", name: "clearSearch", widget: "string" }
          - { label: "Filter By Category", name: "filterByCategory", widget: "string" }

  - name: "content_fr"
    label: "Contenu Site (Francais)"
    editor:
      preview: false
    files:
      - name: "hero_text_fr"
        label: "Texte Hero (FR)"
        file: "naacus-website/public/content/hero.fr.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - { label: "Texte d'adhesion", name: "membershipTeaser", widget: "string" }
          - { label: "Avantage 1", name: "benefit1", widget: "string" }
          - { label: "Avantage 2", name: "benefit2", widget: "string" }
          - { label: "Avantage 3", name: "benefit3", widget: "string" }
          - { label: "Rejoindre", name: "joinCommunity", widget: "string" }
          - { label: "Mission", name: "learnMission", widget: "string" }
          - { label: "Calendrier", name: "viewCalendar", widget: "string" }
          - { label: "Participer", name: "getInvolved", widget: "string" }
      - name: "faq_text_fr"
        label: "Texte FAQ (FR)"
        file: "naacus-website/public/content/faq.fr.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - { label: "Placeholder recherche", name: "searchPlaceholder", widget: "string" }
          - { label: "Label champ recherche", name: "searchInputLabel", widget: "string" }
          - { label: "Label effacer", name: "clearSearch", widget: "string" }
          - { label: "Filtrer par categorie", name: "filterByCategory", widget: "string" }

  - name: "assets"
    label: "Media Assets"
    editor:
      preview: false
    files:
      - name: "hero_images"
        label: "Hero Slideshow Images"
        file: "naacus-website/public/content/hero-images.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{fields.image}}"
            field:
              label: "Image"
              name: "image"
              widget: "image"
