name: Release Branch to Staging

on:
  push:
    branches:
      - release/*
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: release-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality_gate_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Release Quality Gate Job
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./naacus-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create environment file
        run: |
          cat > .env.production.local << EOF2
          REACT_APP_API_BASE_URL=${{ secrets.API_BASE_URL_TEST || 'http://localhost:5001' }}
          CI=true
          EOF2

      - name: Build app
        run: npm run build

      - name: Run translation parity gate
        run: npm run check:translations

      - name: Run AI-first intent evals
        run: npm run eval:ai-first:html

      - name: Run mission threshold check (when metrics are provided)
        run: |
          if [ -f reports/ai-first-metrics.json ]; then
            npm run check:ai-first:thresholds
          else
            echo "No reports/ai-first-metrics.json found, skipping mission threshold gate."
          fi

      - name: Run accessibility checks
        run: npm run check:a11y

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.run_id }}
          path: ./naacus-website/build/
          retention-days: 1

  deploy_staging_job:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    name: Deploy Staging Job
    needs: quality_gate_job
    environment: staging
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ github.run_id }}
          path: ./naacus-website/build/

      - name: Build And Deploy to Staging
        id: builddeploy_staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./naacus-website/build"
          api_location: ""
          output_location: ""
          skip_app_build: true
