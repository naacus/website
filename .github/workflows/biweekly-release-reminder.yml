name: Weekly Release Branch Cut

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cut_weekly_release_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly release branch and checklist issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const yyyy = now.getUTCFullYear();
            const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(now.getUTCDate()).padStart(2, '0');
            const releaseDate = `${yyyy}-${mm}-${dd}`;
            const branchName = `release/${releaseDate}`;
            const title = `Release ${releaseDate}`;

            const repo = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            // Get SHA for develop branch and create release branch if it does not exist.
            const developRef = await github.rest.git.getRef({
              ...repo,
              ref: 'heads/develop',
            });

            try {
              await github.rest.git.getRef({
                ...repo,
                ref: `heads/${branchName}`,
              });
              core.info(`Release branch already exists: ${branchName}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                ...repo,
                ref: `refs/heads/${branchName}`,
                sha: developRef.data.object.sha,
              });
              core.info(`Created release branch ${branchName} from develop`);
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              ...repo,
              state: 'open',
              labels: 'release',
              per_page: 100,
            });

            if (issues.some((i) => i.title === title)) {
              core.info(`Release issue already exists: ${title}`);
              return;
            }

            const body = [
              'Weekly release branch cut completed.',
              '',
              `Release branch: ${branchName}`,
              'Use the Release Checklist issue template and complete all gates before production deployment after one week in staging.',
              '',
              'Suggested next steps:',
              '- Validate in staging for one week',
              '- Apply bug fixes on release branch (or hotfix branch if production is impacted)',
              '- Promote to production using Production Release workflow',
            ].join('\n');

            await github.rest.issues.create({
              ...repo,
              title,
              body,
              labels: ['release'],
            });
