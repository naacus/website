name: Security Dependency Scan

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  secret_scan:
    runs-on: ubuntu-latest
    name: Secret Scan (Gitleaks)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Gitleaks scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --no-git --config="/repo/.gitleaks.toml" --redact --exit-code=1

  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Dependency Review
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0

  npm_audit:
    runs-on: ubuntu-latest
    name: NPM Audit Gate
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./naacus-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high and critical)
        shell: bash
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          set -o pipefail
          npm audit --audit-level=high --json | tee npm-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: naacus-website/npm-audit-report.json
