name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: azure-swa-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality_gate_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality Gate Job
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./naacus-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Azure login (OIDC)
        id: azure_login
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load Stripe public key from Azure Key Vault
        id: kv_fetch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          KV_NAME='${{ secrets.AZURE_KEY_VAULT_NAME }}'
          SECRET_NAME='${{ secrets.AZURE_STRIPE_PUBLIC_KEY_SECRET_NAME }}'

          if [ -z "$KV_NAME" ]; then
            echo "AZURE_KEY_VAULT_NAME is not configured; skipping Azure Key Vault lookup."
            exit 0
          fi

          if [ -z "$SECRET_NAME" ]; then
            SECRET_NAME='StripePublicKey'
          fi

          STRIPE_KEY="$(az keyvault secret show \
            --vault-name "$KV_NAME" \
            --name "$SECRET_NAME" \
            --query value \
            -o tsv)"

          if [ -z "$STRIPE_KEY" ]; then
            echo "Stripe key from Key Vault is empty or unavailable."
            exit 1
          fi

          echo "::add-mask::$STRIPE_KEY"
          echo "stripe_key=$STRIPE_KEY" >> "$GITHUB_OUTPUT"

      - name: Resolve Stripe public key (Azure first, GitHub fallback)
        shell: bash
        run: |
          set -euo pipefail

          KV_NAME='${{ secrets.AZURE_KEY_VAULT_NAME }}'
          STRIPE_KEY=''
          STRIPE_KEY_SOURCE='none'
          STRIPE_STATUS='warning'

          if [ -n "$KV_NAME" ]; then
            if [ '${{ steps.azure_login.outcome }}' = 'success' ] && [ '${{ steps.kv_fetch.outcome }}' = 'success' ]; then
              STRIPE_KEY='${{ steps.kv_fetch.outputs.stripe_key }}'
              STRIPE_KEY_SOURCE='azure-key-vault'
              STRIPE_STATUS='ok'
            else
              echo "Azure Key Vault is configured but retrieval failed; trying GitHub fallback to keep pipeline moving."
            fi
          fi

          if [ -z "$STRIPE_KEY" ]; then
            STRIPE_KEY='${{ secrets.REACT_APP_STRIPE_PUBLIC_KEY || secrets.STRIPE_PUBLIC_KEY_TEST || '' }}'
            if [ -n "$STRIPE_KEY" ]; then
              STRIPE_KEY_SOURCE='github-secrets'
              STRIPE_STATUS='ok'
            fi
          fi

          if [ -n "$STRIPE_KEY" ] && [[ ! "$STRIPE_KEY" =~ ^pk_(test|live)_[A-Za-z0-9]{10,}$ ]]; then
            echo "Resolved Stripe key is invalid format; disabling Stripe buy buttons for this build."
            STRIPE_KEY=''
            STRIPE_KEY_SOURCE='none'
            STRIPE_STATUS='warning'
          fi

          if [ -n "$STRIPE_KEY" ]; then
            echo "::add-mask::$STRIPE_KEY"
          fi
          echo "REACT_APP_STRIPE_PUBLIC_KEY=$STRIPE_KEY" >> "$GITHUB_ENV"
          echo "STRIPE_KEY_SOURCE=$STRIPE_KEY_SOURCE" >> "$GITHUB_ENV"
          echo "STRIPE_KEY_STATUS=$STRIPE_STATUS" >> "$GITHUB_ENV"

          echo "Stripe key source: $STRIPE_KEY_SOURCE"
          {
            echo "### Stripe Key Source"
            echo "- Source: $STRIPE_KEY_SOURCE"
            echo "- Status: $STRIPE_STATUS"
            if [ "$STRIPE_KEY_SOURCE" = 'none' ]; then
              echo "- Note: Stripe key unavailable/invalid. Build continues with Stripe buy buttons disabled (safe fallback)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mask sensitive secrets
        run: |
          echo "::add-mask::${{ secrets.REACT_APP_AZURE_CLIENT_SECRET }}"

      # Create .env.development for develop quality gates.
      # Stripe public key is resolved from Azure Key Vault or GitHub secrets fallback in the previous step.
      # Azure credentials are injected for M365 (member/volunteer registration, analytics) integration.
      - name: Create development environment file
        run: |
          cat > .env.development << EOF2
          REACT_APP_STRIPE_PUBLIC_KEY=${REACT_APP_STRIPE_PUBLIC_KEY}
          REACT_APP_API_BASE_URL=${{ secrets.API_BASE_URL_TEST || 'http://localhost:5001' }}
          REACT_APP_DEBUG_PAYMENTS=true
          REACT_APP_GOOGLE_MAPS_API_KEY_PROD=${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY_PROD }}
          REACT_APP_GOOGLE_MAPS_API_KEY_DEV=${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY_DEV }}
          
          # Azure AD & Microsoft 365 Integration
          # Note: REACT_APP_REDIRECT_URI is not set here to allow window.location.origin to be used
          # This ensures correct redirect URIs for both production (https://www.naacus.org) and dev (http://localhost:3000)
          REACT_APP_AZURE_CLIENT_ID=${{ secrets.REACT_APP_AZURE_CLIENT_ID }}
          REACT_APP_AZURE_TENANT_ID=${{ secrets.REACT_APP_AZURE_TENANT_ID }}
          REACT_APP_AZURE_CLIENT_SECRET=${{ secrets.REACT_APP_AZURE_CLIENT_SECRET }}
          
          # SharePoint Configuration
          REACT_APP_SHAREPOINT_SITE_URL=${{ secrets.REACT_APP_SHAREPOINT_SITE_URL }}
          REACT_APP_MEMBERSHIP_LIST_ID=${{ secrets.REACT_APP_MEMBERSHIP_LIST_ID }}
          REACT_APP_VOLUNTEER_LIST_ID=${{ secrets.REACT_APP_VOLUNTEER_LIST_ID }}
          REACT_APP_EVENT_REGISTRATION_LIST_ID=${{ secrets.REACT_APP_EVENT_REGISTRATION_LIST_ID }}
          REACT_APP_ANALYTICS_LIST_ID=${{ secrets.REACT_APP_ANALYTICS_LIST_ID }}
          
          CI=true
          EOF2

      - name: Validate and report development env vars
        run: |
          set -a
          . ./.env.development
          set +a

          if [ -z "$REACT_APP_STRIPE_PUBLIC_KEY" ]; then
            echo "Stripe key not set for this build. Falling back to non-Stripe Donate Securely buttons."
          fi

          if [ -n "$REACT_APP_STRIPE_PUBLIC_KEY" ] && [[ ! "$REACT_APP_STRIPE_PUBLIC_KEY" =~ ^pk_(test|live)_[A-Za-z0-9]{10,}$ ]]; then
            echo "Invalid REACT_APP_STRIPE_PUBLIC_KEY format detected. Stripe should be disabled by resolver step."
          fi

      - name: Optimize images (WebP conversion)
        run: npm run optimize:images

      - name: Build app with development environment
        run: |
          set -a
          . ./.env.development
          set +a
          npm run build

      - name: Run translation parity gate
        run: npm run check:translations

      - name: Run AI-first intent evals
        run: npm run eval:ai-first:html

      - name: Upload AI-first eval report
        uses: actions/upload-artifact@v4
        with:
          name: ai-first-eval-report
          path: |
            naacus-website/reports/ai-first-eval.json
            naacus-website/reports/ai-first-eval.md
            naacus-website/reports/ai-first-eval.html

      - name: Run mission threshold check (when metrics are provided)
        run: |
          if [ -f reports/ai-first-metrics.json ]; then
            npm run check:ai-first:thresholds
          else
            echo "No reports/ai-first-metrics.json found, skipping mission threshold gate."
          fi

      - name: Run accessibility checks
        run: npm run check:a11y

      # Store build for deployment job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: ./naacus-website/build/
          retention-days: 1

  build_and_deploy_job:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    needs: quality_gate_job
    environment: development
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: ./naacus-website/build/

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_PEBBLE_0F00F890F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./naacus-website/build"
          api_location: ""
          output_location: ""
          skip_app_build: true
