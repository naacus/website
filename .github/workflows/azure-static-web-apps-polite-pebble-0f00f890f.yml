name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: azure-swa-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality_gate_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality Gate Job
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./naacus-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Create .env.development for develop deployments
      - name: Create development environment file
        run: |
          cat > .env.development << EOF2
          REACT_APP_STRIPE_PUBLIC_KEY=${{ secrets.REACT_APP_STRIPE_PUBLIC_KEY || secrets.STRIPE_PUBLIC_KEY_TEST || '' }}
          REACT_APP_API_BASE_URL=${{ secrets.API_BASE_URL_TEST || 'http://localhost:5001' }}
          REACT_APP_DEBUG_PAYMENTS=true
          CI=true
          EOF2

      - name: Validate required development env vars
        run: |
          set -a
          . ./.env.development
          set +a

          if [ -z "$REACT_APP_STRIPE_PUBLIC_KEY" ]; then
            echo "::warning::Missing REACT_APP_STRIPE_PUBLIC_KEY for development build."
            echo "::warning::Set GitHub secret REACT_APP_STRIPE_PUBLIC_KEY (or STRIPE_PUBLIC_KEY_TEST). Falling back to non-sensitive placeholder key for CI build."
            echo "REACT_APP_STRIPE_PUBLIC_KEY=pk_test_ci_placeholder" >> ./.env.development
          fi

      - name: Build app with development environment
        run: |
          set -a
          . ./.env.development
          set +a
          npm run build

      - name: Run translation parity gate
        run: npm run check:translations

      - name: Run AI-first intent evals
        run: npm run eval:ai-first:html

      - name: Upload AI-first eval report
        uses: actions/upload-artifact@v4
        with:
          name: ai-first-eval-report
          path: |
            naacus-website/reports/ai-first-eval.json
            naacus-website/reports/ai-first-eval.md
            naacus-website/reports/ai-first-eval.html

      - name: Run mission threshold check (when metrics are provided)
        run: |
          if [ -f reports/ai-first-metrics.json ]; then
            npm run check:ai-first:thresholds
          else
            echo "No reports/ai-first-metrics.json found, skipping mission threshold gate."
          fi

      - name: Run accessibility checks
        run: npm run check:a11y

      # Store build for deployment job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: ./naacus-website/build/
          retention-days: 1

  build_and_deploy_job:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    needs: quality_gate_job
    environment: development
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: ./naacus-website/build/

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_PEBBLE_0F00F890F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./naacus-website/build"
          api_location: ""
          output_location: ""
          skip_app_build: true
