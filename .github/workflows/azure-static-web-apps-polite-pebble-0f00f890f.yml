name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: azure-swa-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality_gate_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality Gate Job
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./naacus-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Stripe secrets from Key Vault
        run: |
          STRIPE_KEY=$(az keyvault secret show --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --name StripePublicKey --query value -o tsv)
          STRIPE_BUTTON=$(az keyvault secret show --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --name StripeBuyButtonId --query value -o tsv)
          echo "STRIPE_KEY=$STRIPE_KEY" >> $GITHUB_ENV
          echo "STRIPE_BUTTON=$STRIPE_BUTTON" >> $GITHUB_ENV

      # Create environment file with Stripe values from Key Vault
      - name: Create environment file
        run: |
          cat > .env << EOF2
          REACT_APP_STRIPE_PUBLIC_KEY=${{ env.STRIPE_KEY }}
          REACT_APP_STRIPE_BUY_BUTTON_ID=${{ env.STRIPE_BUTTON }}
          REACT_APP_PAYPAL_CLIENT_ID=
          REACT_APP_PAYPAL_ENV=sandbox
          REACT_APP_API_BASE_URL=${{ secrets.API_BASE_URL_TEST || 'http://localhost:5001' }}
          REACT_APP_DEBUG_PAYMENTS=true
          CI=true
          EOF2

      - name: Validate Stripe env values
        run: |
          set -e

          STRIPE_KEY=$(grep '^REACT_APP_STRIPE_PUBLIC_KEY=' .env | cut -d= -f2-)
          BUTTON_ID=$(grep '^REACT_APP_STRIPE_BUY_BUTTON_ID=' .env | cut -d= -f2-)

          if [ -z "$STRIPE_KEY" ] || [ -z "$BUTTON_ID" ]; then
            echo "Stripe env values are empty"
            exit 1
          fi

          if printf '%s' "$STRIPE_KEY" | grep -Eiq 'your_|placeholder|example'; then
            echo "Stripe public key is placeholder"
            exit 1
          fi

          if printf '%s' "$BUTTON_ID" | grep -Eiq 'your_|placeholder|example'; then
            echo "Stripe buy button id is placeholder"
            exit 1
          fi

          if ! printf '%s' "$STRIPE_KEY" | grep -Eq '^pk_(test|live)_.+$'; then
            echo "Stripe public key format invalid"
            exit 1
          fi

          if ! printf '%s' "$BUTTON_ID" | grep -Eq '^buy_btn_.+$'; then
            echo "Stripe buy button id format invalid"
            exit 1
          fi

          echo "Stripe env validation passed"

      - name: Build app
        run: npm run build

      - name: Run AI-first intent evals
        run: npm run eval:ai-first:html

      - name: Upload AI-first eval report
        uses: actions/upload-artifact@v4
        with:
          name: ai-first-eval-report
          path: |
            naacus-website/reports/ai-first-eval.json
            naacus-website/reports/ai-first-eval.md
            naacus-website/reports/ai-first-eval.html

      - name: Run mission threshold check (when metrics are provided)
        run: |
          if [ -f reports/ai-first-metrics.json ]; then
            npm run check:ai-first:thresholds
          else
            echo "No reports/ai-first-metrics.json found, skipping mission threshold gate."
          fi

      - name: Run accessibility checks
        run: npm run check:a11y

      # Store build for deployment job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: ./naacus-website/build/
          retention-days: 1

  build_and_deploy_job:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    needs: quality_gate_job
    defaults:
      run:
        working-directory: ./naacus-website
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: ./naacus-website/build/

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_PEBBLE_0F00F890F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./naacus-website"
          api_location: ""
          output_location: "build"
