# NAACUS Backend API Configuration
server.port=8080
spring.application.name=naacus-backend

# API Version
api.version=v1
api.base-url=https://api.naacus.org/v1

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://naacus.org,https://test.naacus.org

# Logging
logging.level.org.naacus=DEBUG
logging.level.org.springframework.web=INFO

# JSON serialization
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# JWT Configuration (placeholders for production)
jwt.secret=${JWT_SECRET:your-secret-key-here}
jwt.expiry=24h
jwt.refresh-expiry=30d

# ========================================
# Microsoft Dataverse Configuration
# ========================================

# Azure AD Authentication
azure.tenant-id=${AZURE_TENANT_ID:your-tenant-id}
azure.client-id=${AZURE_CLIENT_ID:your-client-id}
azure.client-secret=${AZURE_CLIENT_SECRET:your-client-secret}

# Dataverse Environment URL (e.g., https://yourorg.crm.dynamics.com)
dataverse.environment-url=${DATAVERSE_URL:https://yourorg.crm.dynamics.com}

# Dataverse Table Names (with publisher prefix 'naacus_')
dataverse.tables.members=naacus_members
dataverse.tables.volunteers=naacus_volunteers
dataverse.tables.contacts=naacus_contactinquiries
dataverse.tables.donations=naacus_donations
dataverse.tables.newsletter=naacus_newslettersubscribers
dataverse.tables.event-registrations=naacus_eventregistrations

# Use mock data when Dataverse is not configured
app.use-mock-data=${USE_MOCK_DATA:true}
